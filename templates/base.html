<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title | default(profile.identity.display_name ~ " | " ~ profile.site.title) }}</title>
    <meta name="description" content="{{ profile.identity.hero_line }}">
    <meta property="og:title" content="{{ page_title | default(profile.identity.display_name ~ " | " ~ profile.site.title) }}">
    <meta property="og:description" content="{{ profile.identity.hero_line }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gilliangao.github.io/{{ page_path | default('') }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page_title | default(profile.identity.display_name ~ " | " ~ profile.site.title) }}">
    <meta name="twitter:description" content="{{ profile.identity.hero_line }}">
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="static/style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <nav class="nav" aria-label="Primary navigation">
        <a class="brand" href="index.html#hero" aria-label="Gillian Gao home">
          <span class="brand-mark">GG</span>
          <span>Gillian Gao</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
          <span class="sr-only">Toggle navigation</span>
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="index.html#about">{{ profile.nav.about }}</a>
          <a href="index.html#projects">{{ profile.nav.projects }}</a>
          <a href="index.html#timeline">{{ profile.nav.timeline }}</a>
          <a href="index.html#skills">{{ profile.nav.skills }}</a>
          <a href="services.html"{% if page_path | default('') == 'services.html' %} aria-current="page"{% endif %}>Services</a>
          <a href="index.html#contact">{{ profile.nav.contact }}</a>
        </div>
      </nav>
    </header>
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <p>&copy; {{ year }} {{ profile.identity.display_name }}. {{ profile.site.footer_note }}</p>
    </footer>
    <script src="static/main.js"></script>
  </body>
</html>
